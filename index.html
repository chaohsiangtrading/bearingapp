<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>軸受図書館</title>
    
    <!-- PWA / iOS 支援設定 -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="軸受図書館">
    <link rel="apple-touch-icon" href="https://via.placeholder.com/192/002B49/FFFFFF?text=BEARING">

    <style>
        :root {
            --skf-dark-blue: #002B49;
            --skf-black: #111111;
            --skf-red: #E31B23;
            --bg-industrial: #181c24;
            --card-bg: #222831;
            --text-main: #f8f9fa;
            --text-secondary: #9aa0a6;
            --border-color: #323842;
            --neon-blue: #61b0ff;
        }
        * { box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; margin: 0; background-color: var(--bg-industrial); color: var(--text-main); padding-bottom: 70px; }

        .app-header { background-color: var(--skf-dark-blue); color: white; height: 55px; display: flex; justify-content: space-between; align-items: center; padding: 0 15px; border-bottom: 3px solid var(--skf-red); position: sticky; top: 0; z-index: 100; }
        .header-title { font-size: 18px; font-weight: bold; letter-spacing: 1.5px; }
        .header-badge { background-color: var(--skf-red); color: white; font-size: 11px; padding: 3px 8px; border-radius: 4px; font-weight: bold; }
        
        .container { max-width: 650px; margin: 15px auto; padding: 0 12px; }
        .search-section { background-color: var(--card-bg); padding: 15px; border-radius: 6px; border: 1px solid var(--border-color); margin-bottom: 15px; position: relative; }
        
        .search-bar { display: flex; border: 2px solid var(--skf-dark-blue); border-radius: 4px; overflow: hidden; background-color: #111; position: relative; }
        .search-input { flex: 1; border: none; background: transparent; color: #fff; padding: 12px 15px; font-size: 16px; outline: none; }
        .search-btn { background-color: var(--skf-red); color: white; border: none; padding: 0 22px; cursor: pointer; }

        /* 更具科技感的提示字詞 */
        .search-tip { 
            font-family: monospace;
            font-size: 11px; 
            color: var(--neon-blue); 
            margin-top: 10px; 
            display: flex; 
            align-items: center; 
            gap: 6px; 
            letter-spacing: 0.8px; 
            background: rgba(97, 176, 255, 0.05);
            padding: 6px 10px;
            border-radius: 4px;
            border-left: 2px solid var(--neon-blue);
        }

        /* Auto-complete 下拉提示清單 */
        .autocomplete-list { position: absolute; top: 100%; left: 0; right: 0; background-color: #1a1f29; border: 1px solid var(--border-color); border-top: none; border-radius: 0 0 4px 4px; z-index: 50; max-height: 200px; overflow-y: auto; display: none; }
        .autocomplete-item { padding: 10px 15px; font-size: 14px; color: var(--text-main); cursor: pointer; border-bottom: 1px solid var(--border-color); }
        .autocomplete-item:hover, .autocomplete-item.highlight { background-color: rgba(97, 176, 255, 0.15); color: var(--neon-blue); }

        /* 橫向滑動標籤 */
        .quick-tags { display: flex; flex-wrap: nowrap; overflow-x: auto; gap: 8px; margin-top: 12px; padding-bottom: 5px; -webkit-overflow-scrolling: touch; scroll-behavior: smooth; }
        .quick-tags::-webkit-scrollbar { display: none; }
        .tag { background-color: #111; color: var(--text-secondary); padding: 6px 14px; border-radius: 20px; font-size: 13px; cursor: pointer; border: 1px solid var(--border-color); white-space: nowrap; transition: 0.2s; }
        .tag.active { background-color: var(--skf-dark-blue); color: #fff; border-color: var(--skf-red); }

        .filter-controls { margin-top: 12px; padding-top: 10px; border-top: 1px solid var(--border-color); }
        .checkbox-label { display: flex; align-items: center; cursor: pointer; font-size: 13px; }
        .checkbox-label input { accent-color: var(--skf-red); width: 16px; height: 16px; margin-right: 8px; }

        .table-card { background-color: var(--card-bg); border-radius: 6px; border: 1px solid var(--border-color); overflow: hidden; }
        .result-table { width: 100%; border-collapse: collapse; }
        .result-table td { padding: 14px 15px; border-bottom: 1px solid var(--border-color); font-size: 14px; }
        
        .td-partno { font-weight: bold; color: var(--neon-blue); cursor: pointer; padding: 8px; border-radius: 4px; transition: 0.2s; }
        .td-partno:hover { background-color: rgba(97, 176, 255, 0.1); }
        
        /* 科技感加號按鈕 */
        .btn-add-cart {
            background: linear-gradient(135deg, #002B49 0%, #111 100%);
            color: var(--neon-blue);
            border: 1px solid var(--neon-blue);
            width: 32px;
            height: 32px;
            border-radius: 6px;
            font-size: 18px;
            font-weight: bold;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.2s ease;
            box-shadow: 0 0 8px rgba(97, 176, 255, 0.2);
        }
        .btn-add-cart:hover {
            background-color: var(--neon-blue);
            color: #000;
            box-shadow: 0 0 12px rgba(97, 176, 255, 0.6);
            transform: scale(1.05);
        }
        .btn-add-cart:active { transform: scale(0.95); }
        
        .stock-badge { display: inline-block; padding: 4px 10px; border-radius: 4px; font-weight: bold; font-size: 13px; border: 1px solid; }
        .stock-zero { background-color: rgba(227, 27, 35, 0.15); color: var(--skf-red); border-color: rgba(227, 27, 35, 0.3); }
        .stock-ok { background-color: rgba(0, 150, 0, 0.15); color: #4cd964; border-color: rgba(76, 217, 100, 0.3); }

        .toast { position: fixed; bottom: 80px; left: 50%; transform: translateX(-50%); background: #4cd964; color: #000; padding: 12px 24px; border-radius: 20px; font-weight: bold; z-index: 9999; animation: fadeInOut 2s forwards; }
        @keyframes fadeInOut { 0% { opacity: 0; } 20% { opacity: 1; } 80% { opacity: 1; } 100% { opacity: 0; } }

        /* 底部導航欄 */
        .app-footer { background-color: var(--skf-black); height: 60px; border-top: 1px solid var(--border-color); display: flex; justify-content: space-around; align-items: center; position: fixed; bottom: 0; width: 100%; max-width: 650px; left: 50%; transform: translateX(-50%); z-index: 100; }
        .footer-item { text-decoration: none; color: var(--text-secondary); display: flex; flex-direction: column; align-items: center; font-size: 11px; gap: 3px; flex: 1; cursor: pointer; transition: color 0.2s; background: none; border: none; outline: none; position: relative; }
        .footer-item.active { color: var(--skf-red); }
        .footer-icon { width: 22px; height: 22px; fill: currentColor; }
        .cart-badge-count { position: absolute; top: 2px; right: calc(50% - 16px); background: var(--skf-red); color: #fff; font-size: 10px; padding: 1px 5px; border-radius: 10px; font-weight: bold; display: none; }

        /* 通用底拉視窗 (Modal) 樣式 */
        .modal-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); display: none; justify-content: center; align-items: flex-end; z-index: 1000; }
        .modal-container { background: var(--bg-industrial); width: 100%; max-width: 650px; height: 88vh; border-radius: 16px 16px 0 0; overflow-y: auto; box-shadow: 0 -5px 25px rgba(0,0,0,0.6); animation: slideUp 0.3s ease-out; position: relative; display: flex; flex-direction: column; }
        @keyframes slideUp { from { transform: translateY(100%); } to { transform: translateY(0); } }

        .modal-close-btn { position: absolute; right: 15px; top: 15px; background: rgba(0,0,0,0.3); border: none; color: white; width: 30px; height: 30px; border-radius: 50%; font-size: 16px; cursor: pointer; z-index: 10; }

        /* 購物車視窗專屬樣式 */
        .cart-modal-header { background: linear-gradient(135deg, #002B49 0%, #1a1a1a 100%); padding: 20px 15px; color: white; border-bottom: 2px solid var(--skf-red); }
        .cart-modal-header h2 { margin: 0 0 4px 0; font-size: 18px; display: flex; align-items: center; gap: 8px; }
        .cart-modal-body { flex: 1; padding: 15px; overflow-y: auto; }
        .cart-item-card { background: var(--card-bg); border: 1px solid var(--border-color); border-radius: 8px; padding: 12px; margin-bottom: 10px; display: flex; justify-content: space-between; align-items: center; }
        .cart-item-info h4 { margin: 0 0 4px 0; color: var(--neon-blue); font-size: 15px; }
        .cart-item-info p { margin: 0; font-size: 12px; color: var(--text-secondary); }
        .cart-item-actions { display: flex; align-items: center; gap: 10px; }
        .qty-btn { background: #333; color: #fff; border: 1px solid var(--border-color); width: 28px; height: 28px; border-radius: 4px; font-weight: bold; cursor: pointer; }
        .cart-footer-bar { padding: 15px; background: var(--card-bg); border-top: 1px solid var(--border-color); display: flex; gap: 10px; }
        .btn-action-primary { flex: 1; background: var(--skf-red); color: white; border: none; padding: 12px; border-radius: 6px; font-weight: bold; cursor: pointer; text-align: center; font-size: 14px; }
        .btn-action-secondary { flex: 1; background: #002B49; color: white; border: 1px solid var(--neon-blue); padding: 12px; border-radius: 6px; font-weight: bold; cursor: pointer; text-align: center; font-size: 14px; }

        /* 會員中心頂部紅黑漸層看板 */
        .member-header-bg { background: linear-gradient(135deg, #8B0000 0%, #1a1a1a 100%); padding: 20px 15px 25px 15px; color: white; position: relative; }
        .member-info-row { display: flex; align-items: center; gap: 12px; margin-bottom: 20px; }
        .member-avatar { width: 55px; height: 55px; background: #333; border-radius: 50%; border: 2px solid #ff4d4d; display: flex; align-items: center; justify-content: center; font-size: 20px; font-weight: bold; }
        .member-details h2 { margin: 0 0 4px 0; font-size: 16px; display: flex; align-items: center; gap: 8px; }
        .member-level-tag { background: #ff4d4d; color: white; font-size: 10px; padding: 2px 6px; border-radius: 4px; }
        .member-company { font-size: 13px; color: #d1d5db; margin: 0; }
        .member-stats { display: flex; justify-content: space-around; text-align: center; background: rgba(0,0,0,0.25); padding: 12px; border-radius: 8px; }
        .stat-num { font-size: 18px; font-weight: bold; color: #fff; margin-bottom: 2px; }
        .stat-label { font-size: 12px; color: var(--text-secondary); }

        .vip-card-banner { margin: -10px 15px 15px 15px; background: linear-gradient(90deg, #2c2c2c 0%, #3a3a3a 100%); border: 1px solid #d4af37; border-radius: 8px; padding: 12px 15px; display: flex; justify-content: space-between; align-items: center; color: #f3e5ab; }
        .vip-title { font-size: 13px; font-weight: bold; display: flex; align-items: center; gap: 6px; }
        .vip-btn { background: #d4af37; color: #111; border: none; padding: 6px 14px; border-radius: 20px; font-size: 12px; font-weight: bold; cursor: pointer; }

        .member-section { background: var(--card-bg); margin: 0 15px 15px 15px; border-radius: 8px; border: 1px solid var(--border-color); overflow: hidden; }
        .section-header { padding: 12px 15px; font-size: 14px; font-weight: bold; border-bottom: 1px solid var(--border-color); display: flex; justify-content: space-between; align-items: center; color: var(--text-main); }
        .section-header span { font-size: 12px; color: var(--text-secondary); font-weight: normal; cursor: pointer; }

        .order-status-grid { display: flex; justify-content: space-around; padding: 15px 10px; text-align: center; }
        .order-status-item { background: none; border: none; color: var(--text-secondary); display: flex; flex-direction: column; align-items: center; gap: 6px; font-size: 12px; cursor: pointer; }
        .order-status-item svg { width: 22px; height: 22px; fill: var(--neon-blue); }

        .menu-list-item { padding: 14px 15px; display: flex; justify-content: space-between; align-items: center; font-size: 14px; color: var(--text-main); border-bottom: 1px solid var(--border-color); cursor: pointer; background: none; width: 100%; border-left: none; border-right: none; border-top: none; text-align: left; }
        .menu-list-item:last-child { border-bottom: none; }
        .menu-list-item:hover { background-color: rgba(255,255,255,0.03); }
        .menu-arrow { color: var(--text-secondary); font-size: 12px; }
    </style>
</head>
<body>

<header class="app-header">
    <div class="header-title">⚡軸受図書館</div>
    <div class="header-badge">PWA PRO</div>
</header>

<div class="container" id="mainContainer">

        </div>

        <div class="member-section" style="margin-bottom: 30px;">
            <button class="menu-list-item" onclick="alert('請聯絡管理員綁定帳號')">
                <span>🔒 帳號安全與綁定</span> <span class="menu-arrow">›</span>
            </button>
            <button class="menu-list-item" onclick="alert('目前統編：5300xxxx (如需修改請洽業務)')">
                <span>🧾 公司統編與發票資訊</span> <span class="menu-arrow">›</span>
            </button>
            <button class="menu-list-item" onclick="alert('客服專線：07-XXXXXXX')">
                <span>☎️ 線上客服與幫助中心</span> <span class="menu-arrow">›</span>
            </button>
        </div>
    </div>
</div>

<script>
    const GAS_URL = "https://script.google.com/macros/s/AKfycbzvSBMBHs9M3CKPEw0tfaOxPA58pSDgVAlN5cGHRFdPz2MW7kHB1KHJGYiYWOnX62mw/exec";
    let allData = [];
    let cart = [];

    async function initDB() {
        try {
            const res = await fetch(GAS_URL);
            const resData = await res.json();
            allData = resData.data;
            document.getElementById('loading').style.display = 'none';
            document.getElementById('searchInput').disabled = false;
            renderTable(allData.slice(0, 15));
        } catch (e) { console.error(e); }
    }

    function handleInput() {
        const query = document.getElementById('searchInput').value.trim().toLowerCase();
        const listEl = document.getElementById('autocompleteList');
        handleSearch();

        if (!query) {
            listEl.style.display = 'none';
            return;
        }

        const matches = allData.filter(item => item.p.toLowerCase().includes(query)).slice(0, 5);

        if (matches.length > 0) {
            listEl.innerHTML = matches.map(item => `
                <div class="autocomplete-item" onclick="selectSuggestion('${item.p}')">
                    <b>${item.p}</b> <span style="color:var(--text-secondary); font-size:12px;">(${item.d})</span>
                </div>
            `).join('');
            listEl.style.display = 'block';
        } else {
            listEl.style.display = 'none';
        }
    }

    function selectSuggestion(partNo) {
        document.getElementById('searchInput').value = partNo;
        document.getElementById('autocompleteList').style.display = 'none';
        handleSearch();
    }

    document.addEventListener('click', function(e) {
        if (!e.target.closest('.search-bar')) {
            document.getElementById('autocompleteList').style.display = 'none';
        }
    });

    function handleSearch() {
        const query = document.getElementById('searchInput').value.toLowerCase();
        const inStockOnly = document.getElementById('inStockOnly').checked;
        const filtered = allData.filter(item => {
            if (inStockOnly && Number(item.s || 0) <= 0) return false;
            return item.p.toLowerCase().includes(query) || item.d.toLowerCase().includes(query);
        });
        renderTable(filtered.slice(0, 15));
    }

    function quickSearch(kw, e) {
        document.getElementById('searchInput').value = kw;
        document.getElementById('autocompleteList').style.display = 'none';
        document.querySelectorAll('.tag').forEach(t => t.classList.remove('active'));
        if(e && e.target) e.target.classList.add('active');
        handleSearch();
    }

    // 購物車功能邏輯
    function addToCart(partNo, description) {
        const existing = cart.find(item => item.p === partNo);
        if (existing) {
            existing.qty += 1;
        } else {
            cart.push({ p: partNo, d: description, qty: 1 });
        }
        updateCartBadge();
        showToast(`已加入詢價：${partNo}`);
    }

    function updateCartBadge() {
        const badge = document.getElementById('cartBadge');
        const totalQty = cart.reduce((sum, item) => sum + item.qty, 0);
        if (totalQty > 0) {
            badge.innerText = totalQty;
            badge.style.display = 'inline-block';
        } else {
            badge.style.display = 'none';
        }
    }

    function changeQty(partNo, delta) {
        const item = cart.find(i => i.p === partNo);
        if (item) {
            item.qty += delta;
            if (item.qty <= 0) {
                cart = cart.filter(i => i.p !== partNo);
            }
        }
        renderCartModal();
        updateCartBadge();
    }

    function clearCart() {
        if (cart.length === 0) return;
        if (confirm('確定要清空詢價購物車嗎？')) {
            cart = [];
            renderCartModal();
            updateCartBadge();
        }
    }

    function checkoutCart() {
        if (cart.length === 0) return;
        let text = '【 軸受図書館 - 詢價單 】\n';
        cart.forEach((item, idx) => {
            text += `${idx + 1}. 型號: ${item.p} | 說明: ${item.d} | 數量: ${item.qty}\n`;
        });
        copyToClipboard(text);
        alert('詢價清單已完整複製！可直接貼上至 LINE 傳送給業務。');
        toggleCartModal(false);
    }

    function renderCartModal() {
        const bodyEl = document.getElementById('cartModalBody');
        const subtitleEl = document.getElementById('cartCountSubtitle');
        const totalQty = cart.reduce((sum, item) => sum + item.qty, 0);
        
        subtitleEl.innerText = `目前共 ${cart.length} 種品項，總計 ${totalQty} 件`;

        if (cart.length === 0) {
            bodyEl.innerHTML = `<div style="text-align:center; color:var(--text-secondary); padding:40px 0;">購物車目前沒有品項<br>請至型錄點擊 [+] 按鈕加入詢價</div>`;
            return;
        }

        bodyEl.innerHTML = cart.map(item => `
            <div class="cart-item-card">
                <div class="cart-item-info">
                    <h4>${item.p}</h4>
                    <p>${item.d}</p>
                </div>
                <div class="cart-item-actions">
                    <button class="qty-btn" onclick="changeQty('${item.p}', -1)">-</button>
                    <span style="font-weight:bold; min-width:20px; text-align:center;">${item.qty}</span>
                    <button class="qty-btn" onclick="changeQty('${item.p}', 1)">+</button>
                </div>
            </div>
        `).join('');
    }

    function toggleCartModal(show) {
        if (show) renderCartModal();
        document.getElementById('cartModal').style.display = show ? 'flex' : 'none';
    }

    function toggleMemberModal(show) {
        document.getElementById('memberModal').style.display = show ? 'flex' : 'none';
    }

    function closeModal(e, modalId) {
        if (e.target.id === modalId) {
            document.getElementById(modalId).style.display = 'none';
        }
    }

    function footerNav(action, el) {
        document.querySelectorAll('.footer-item').forEach(item => item.classList.remove('active'));
        el.classList.add('active');

        if (action === 'home') {
            document.getElementById('searchInput').value = '';
            document.getElementById('inStockOnly').checked = false;
            document.getElementById('autocompleteList').style.display = 'none';
            const tags = document.querySelectorAll('.tag');
            tags.forEach(t => t.classList.remove('active'));
            tags[0].classList.add('active');
            renderTable(allData.slice(0, 15));
            window.scrollTo({ top: 0, behavior: 'smooth' });
        } else if (action === 'cart') {
            toggleCartModal(true);
        } else if (action === 'stock') {
            document.getElementById('inStockOnly').checked = true;
            handleSearch();
            window.scrollTo({ top: 0, behavior: 'smooth' });
        } else if (action === 'info') {
            toggleMemberModal(true);
        }
    }

    function showSystemInfo() {
        alert(`資料庫總筆數：${allData.length} 筆\n運行狀態：PWA 正常連線\n版本：PWA 台灣PRO v3.4 (含獨立購物車視窗)`);
    }

    function copyToClipboard(text) {
        if (!text) return;
        if (navigator.clipboard && navigator.clipboard.writeText) {
            navigator.clipboard.writeText(text).then(() => showToast(`動作完成`)).catch(() => fallbackCopy(text));
        } else {
            fallbackCopy(text);
        }
    }

    function fallbackCopy(text) {
        const area = document.createElement("textarea");
        area.value = text;
        area.style.position = "fixed";
        area.style.left = "-9999px";
        document.body.appendChild(area);
        area.select();
        document.execCommand('copy');
        document.body.removeChild(area);
        showToast(`動作完成`);
    }

    function showToast(text) {
        const toast = document.createElement('div');
        toast.className = 'toast';
        toast.innerText = text;
        document.body.appendChild(toast);
        setTimeout(() => toast.remove(), 2000);
    }

    function renderTable(items) {
        document.getElementById('resultBody').innerHTML = items.map(item => `
            <tr>
                <td class="td-partno" onclick="copyToClipboard('${item.p}')">${item.p}</td>
                <td>${item.d}</td>
                <td style="text-align: right; white-space: nowrap;">
                    <div style="display: flex; align-items: center; justify-content: flex-end; gap: 8px;">
                        <span class="stock-badge ${Number(item.s) <= 0 ? 'stock-zero' : 'stock-ok'}">${item.s || 0}</span>
                        <button class="btn-add-cart" onclick="addToCart('${item.p.replace(/'/g, "\\'")}', '${item.d.replace(/'/g, "\\'")}')" title="加入購物車詢價">+</button>
                    </div>
                </td>
            </tr>
        `).join('');
    }

    initDB();
</script>
</body>
</html>
