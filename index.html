<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>軸受図書館 - 牌價與購物車系統</title>
    
    <!-- PWA / iOS 支援設定 -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="軸受図書館">
    <link rel="apple-touch-icon" href="https://via.placeholder.com/192/002B49/FFFFFF?text=BEARING">

    <style>
        :root {
            --skf-dark-blue: #002B49;
            --skf-black: #111111;
            --skf-red: #E31B23;
            --bg-industrial: #181c24;
            --card-bg: #222831;
            --text-main: #f8f9fa;
            --text-secondary: #9aa0a6;
            --border-color: #323842;
        }
        * { box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; margin: 0; background-color: var(--bg-industrial); color: var(--text-main); padding-bottom: 70px; }

        .app-header { background-color: var(--skf-dark-blue); color: white; height: 55px; display: flex; justify-content: space-between; align-items: center; padding: 0 15px; border-bottom: 3px solid var(--skf-red); position: sticky; top: 0; z-index: 100; }
        .header-title { font-size: 18px; font-weight: bold; letter-spacing: 1.5px; }
        .header-badge { background-color: var(--skf-red); color: white; font-size: 11px; padding: 3px 8px; border-radius: 4px; font-weight: bold; }
        
        .container { max-width: 650px; margin: 15px auto; padding: 0 12px; }
        .search-section { background-color: var(--card-bg); padding: 15px; border-radius: 6px; border: 1px solid var(--border-color); margin-bottom: 15px; position: relative; }
        
        .search-bar { display: flex; border: 2px solid var(--skf-dark-blue); border-radius: 4px; overflow: hidden; background-color: #111; position: relative; }
        .search-input { flex: 1; border: none; background: transparent; color: #fff; padding: 12px 15px; font-size: 16px; outline: none; }
        .search-btn { background-color: var(--skf-red); color: white; border: none; padding: 0 22px; cursor: pointer; }

        /* Auto-complete 下拉提示清單 */
        .autocomplete-list { position: absolute; top: 100%; left: 0; right: 0; background-color: #1a1f29; border: 1px solid var(--border-color); border-top: none; border-radius: 0 0 4px 4px; z-index: 50; max-height: 200px; overflow-y: auto; display: none; }
        .autocomplete-item { padding: 10px 15px; font-size: 14px; color: var(--text-main); cursor: pointer; border-bottom: 1px solid var(--border-color); }
        .autocomplete-item:hover { background-color: rgba(97, 176, 255, 0.15); color: #61b0ff; }

        /* 橫向滑動標籤 */
        .quick-tags { display: flex; flex-wrap: nowrap; overflow-x: auto; gap: 8px; margin-top: 15px; padding-bottom: 5px; -webkit-overflow-scrolling: touch; scroll-behavior: smooth; }
        .quick-tags::-webkit-scrollbar { display: none; }
        .tag { background-color: #111; color: var(--text-secondary); padding: 6px 14px; border-radius: 20px; font-size: 13px; cursor: pointer; border: 1px solid var(--border-color); white-space: nowrap; transition: 0.2s; }
        .tag.active { background-color: var(--skf-dark-blue); color: #fff; border-color: var(--skf-red); }

        .filter-controls { margin-top: 15px; padding-top: 10px; border-top: 1px solid var(--border-color); display: flex; justify-content: space-between; align-items: center; }
        .checkbox-label { display: flex; align-items: center; cursor: pointer; font-size: 13px; }
        .checkbox-label input { accent-color: var(--skf-red); width: 16px; height: 16px; margin-right: 8px; }

        .table-card { background-color: var(--card-bg); border-radius: 6px; border: 1px solid var(--border-color); overflow: hidden; }
        .result-table { width: 100%; border-collapse: collapse; }
        .result-table td { padding: 14px 15px; border-bottom: 1px solid var(--border-color); font-size: 14px; }
        
        .td-partno { font-weight: bold; color: #61b0ff; cursor: pointer; padding: 8px; border-radius: 4px; transition: 0.2s; }
        .td-partno:hover { background-color: rgba(97, 176, 255, 0.1); }
        
        .stock-badge { display: inline-block; padding: 4px 10px; border-radius: 4px; font-weight: bold; font-size: 13px; border: 1px solid; }
        .stock-zero { background-color: rgba(227, 27, 35, 0.15); color: var(--skf-red); border-color: rgba(227, 27, 35, 0.3); }
        .stock-ok { background-color: rgba(0, 150, 0, 0.15); color: #4cd964; border-color: rgba(76, 217, 100, 0.3); }

        .toast { position: fixed; bottom: 80px; left: 50%; transform: translateX(-50%); background: #4cd964; color: #000; padding: 12px 24px; border-radius: 20px; font-weight: bold; z-index: 9999; animation: fadeInOut 2s forwards; }
        @keyframes fadeInOut { 0% { opacity: 0; } 20% { opacity: 1; } 80% { opacity: 1; } 100% { opacity: 0; } }

        /* 底部導航欄 (4個按鈕) */
        .app-footer { background-color: var(--skf-black); height: 60px; border-top: 1px solid var(--border-color); display: flex; justify-content: space-around; align-items: center; position: fixed; bottom: 0; width: 100%; max-width: 650px; left: 50%; transform: translateX(-50%); z-index: 100; }
        .footer-item { text-decoration: none; color: var(--text-secondary); display: flex; flex-direction: column; align-items: center; font-size: 11px; gap: 3px; flex: 1; cursor: pointer; transition: color 0.2s; background: none; border: none; outline: none; position: relative; }
        .footer-item.active { color: var(--skf-red); }
        .footer-icon { width: 22px; height: 22px; fill: currentColor; }
        .cart-badge-count { position: absolute; top: 2px; right: 35%; background: var(--skf-red); color: white; font-size: 10px; padding: 1px 5px; border-radius: 10px; font-weight: bold; display: none; }

        /* 科技感牌價表與通用彈窗 Modal 樣式 */
        .modal-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.85); display: none; justify-content: center; align-items: flex-end; z-index: 1000; }
        .price-modal-container { background: var(--bg-industrial); width: 100%; max-width: 650px; height: 90vh; border-radius: 16px 16px 0 0; overflow-y: auto; box-shadow: 0 -5px 25px rgba(0,0,0,0.6); animation: slideUp 0.3s ease-out; position: relative; border-top: 3px solid var(--skf-red); display: flex; flex-direction: column; }
        @keyframes slideUp { from { transform: translateY(100%); } to { transform: translateY(0); } }

        .price-header { background: linear-gradient(135deg, var(--skf-dark-blue) 0%, #111 100%); padding: 18px 20px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--border-color); position: sticky; top: 0; z-index: 10; }
        .price-header-title { font-size: 16px; font-weight: bold; color: #fff; letter-spacing: 1px; display: flex; align-items: center; gap: 8px; }
        .price-close-btn { background: rgba(255,255,255,0.1); border: none; color: white; width: 32px; height: 32px; border-radius: 50%; font-size: 16px; cursor: pointer; }

        /* 品牌與折數控制列 (修改處) */
        .brand-control-bar { display: flex; gap: 10px; padding: 15px; background: var(--card-bg); border-bottom: 1px solid var(--border-color); flex-shrink: 0; align-items: center; }
        .brand-select { flex: 1; background: #111; color: #fff; border: 1px solid var(--border-color); padding: 10px; border-radius: 6px; font-size: 14px; outline: none; }
        .discount-input-wrapper { display: flex; align-items: center; gap: 6px; background: #111; border: 1px solid var(--border-color); padding: 6px 10px; border-radius: 6px; }
        .discount-input-wrapper span { font-size: 13px; color: var(--text-secondary); }
        .discount-input { width: 60px; background: transparent; border: none; color: #4cd964; font-weight: bold; font-size: 14px; text-align: center; outline: none; }

        /* 牌價查詢搜尋框 */
        .price-search-box { padding: 15px; background: var(--bg-industrial); flex-shrink: 0; }
        .price-input-wrapper { display: flex; border: 2px solid var(--skf-dark-blue); border-radius: 6px; overflow: hidden; background: #111; }
        .price-input { flex: 1; border: none; background: transparent; color: #fff; padding: 12px 15px; font-size: 15px; outline: none; }
        .price-input::placeholder { color: var(--text-secondary); font-size: 13px; }
        .price-search-action { background: var(--skf-dark-blue); color: white; border: none; padding: 0 20px; font-weight: bold; cursor: pointer; }

        /* 牌價結果清單 */
        .price-results-area { padding: 0 15px 20px 15px; overflow-y: auto; flex-grow: 1; }
        .price-item-card { background: var(--card-bg); border: 1px solid var(--border-color); border-radius: 8px; padding: 14px; margin-bottom: 10px; display: flex; justify-content: space-between; align-items: center; }
        .price-info h4 { margin: 0 0 4px 0; font-size: 15px; color: #61b0ff; }
        .price-info p { margin: 0 0 6px 0; font-size: 12px; color: var(--text-secondary); }
        .price-calc { text-align: right; }
        .list-price { font-size: 12px; color: var(--text-secondary); text-decoration: line-through; }
        .final-price { font-size: 16px; font-weight: bold; color: #4cd964; }
        .discount-tag { display: inline-block; background: rgba(227, 27, 35, 0.2); color: var(--skf-red); font-size: 10px; padding: 2px 6px; border-radius: 4px; font-weight: bold; margin-left: 5px; }
        
        .action-btn-group { display: flex; gap: 6px; align-items: center; margin-top: 4px; }
        .negotiate-btn { background: #2c323d; color: #f3e5ab; border: 1px solid #d4af37; padding: 4px 10px; border-radius: 4px; font-size: 11px; font-weight: bold; cursor: pointer; }
        .negotiate-btn:hover { background: #d4af37; color: #111; }
        .add-cart-btn { background: #2c323d; color: #4cd964; border: 1px solid #4cd964; padding: 4px 10px; border-radius: 4px; font-size: 11px; font-weight: bold; cursor: pointer; }
        .add-cart-btn:hover { background: #4cd964; color: #111; }

        /* 購物車內容樣式 */
        .cart-content-area { padding: 15px; overflow-y: auto; flex-grow: 1; }
        .cart-item-card { background: var(--card-bg); border: 1px solid var(--border-color); border-radius: 8px; padding: 14px; margin-bottom: 10px; display: flex; justify-content: space-between; align-items: center; }
        .cart-item-info h4 { margin: 0 0 4px 0; font-size: 15px; color: #61b0ff; }
        .cart-item-info p { margin: 0; font-size: 12px; color: var(--text-secondary); }
        .cart-item-controls { display: flex; align-items: center; gap: 10px; }
        .qty-btn { background: #111; color: white; border: 1px solid var(--border-color); width: 28px; height: 28px; border-radius: 4px; cursor: pointer; font-weight: bold; }
        .qty-input { width: 40px; text-align: center; background: #111; border: 1px solid var(--border-color); color: white; border-radius: 4px; padding: 4px; font-size: 14px; }
        .cart-delete-btn { background: rgba(227,27,35,0.2); color: var(--skf-red); border: 1px solid rgba(227,27,35,0.4); padding: 4px 8px; border-radius: 4px; font-size: 12px; cursor: pointer; }
        
        .cart-footer-bar { padding: 15px; background: var(--card-bg); border-top: 1px solid var(--border-color); display: flex; justify-content: space-between; align-items: center; flex-shrink: 0; }
        .checkout-btn { background: var(--skf-red); color: white; border: none; padding: 10px 20px; border-radius: 6px; font-weight: bold; font-size: 15px; cursor: pointer; width: 100%; }
    </style>
</head>
<body>

<header class="app-header">
    <div class="header-title">⚡軸受図書館</div>
    <div class="header-badge">PWA PRO</div>
</header>

<div class="container" id="mainContainer">
    <div class="search-section">
        <div class="search-bar">
            <input type="text" id="searchInput" class="search-input" placeholder="輸入軸承型號..." oninput="handleInput()" autocomplete="off" disabled>
            <button class="search-btn" onclick="handleSearch()">搜尋</button>
            <div id="autocompleteList" class="autocomplete-list"></div>
        </div>
        
        <div class="quick-tags" id="tagContainer">
            <span class="tag active" onclick="quickSearch('', event)">全部</span>
            <span class="tag" onclick="quickSearch('SKF', event)">SKF</span>
            <span class="tag" onclick="quickSearch('FAG', event)">FAG</span>
            <span class="tag" onclick="quickSearch('NSK', event)">NSK</span>
            <span class="tag" onclick="quickSearch('NTN', event)">NTN</span>
            <span class="tag" onclick="quickSearch('KOYO', event)">KOYO</span>
            <span class="tag" onclick="quickSearch('NMB', event)">NMB</span>
            <span class="tag" onclick="quickSearch('EZO', event)">EZO</span>
            <span class="tag" onclick="quickSearch('DODGE', event)">DODGE</span>
            <span class="tag" onclick="quickSearch('TIMKEN', event)">TIMKEN</span>
            <span class="tag" onclick="quickSearch('ASAHI', event)">ASAHI</span>
            <span class="tag" onclick="quickSearch('FYH', event)">FYH</span>
        </div>
        
        <div class="filter-controls">
            <label class="checkbox-label"><input type="checkbox" id="inStockOnly" onchange="handleSearch()"> 僅顯示有現貨</label>
            <span style="font-size: 12px; color: var(--text-secondary);">點擊型號可快速複製</span>
        </div>
    </div>
    <div id="loading" style="text-align:center; padding:20px;">正在連線資料庫...</div>
    <div class="table-card"><table class="result-table"><tbody id="resultBody"></tbody></table></div>
</div>

<!-- 底部導航欄 -->
<footer class="app-footer">
    <button class="footer-item active" onclick="footerNav('home', this)">
        <svg class="footer-icon" viewBox="0 0 1024 1024"><path d="M905.386667 533.76a42.666667 42.666667 0 0 0-26.88-39.253333L533.333333 341.333333a42.666667 42.666667 0 0 0-42.666666 0L145.493333 494.506667a42.666667 42.666667 0 0 0-20.906666 56.32 42.666667 42.666667 0 0 0 56.32 20.906666L512 420.906667l331.093333 150.826666a42.666667 42.666667 0 0 0 56.32-20.906666 42.666667 42.666667 0 0 0 5.973334-17.066667z" fill="currentColor"></path><path d="M853.333333 640v170.666667a85.333333 85.333333 0 0 1-85.333333 85.333333H256a85.333333 85.333333 0 0 1-85.333333-85.333333V640h-42.666667v170.666667a128 128 0 0 0 128 128h512a128 128 0 0 0 128-128V640h-42.666667z" fill="currentColor"></path></svg>
        型錄首頁
    </button>
    <button class="footer-item" onclick="footerNav('cart', this)">
        <svg class="footer-icon" viewBox="0 0 1024 1024"><path d="M832 341.333333H725.333333V256a213.333333 213.333333 0 0 0-426.666666 0v85.333333H192a85.333333 85.333333 0 0 0-85.333333 85.333334l42.666666 469.333333a85.333333 85.333333 0 0 0 85.333334 76.8h597.333333a85.333333 85.333333 0 0 0 85.333333-76.8l42.666667-469.333333A85.333333 85.333333 0 0 0 832 341.333333z" fill="currentColor"></path></svg>
        購物車
        <span class="cart-badge-count" id="cartBadgeCount">0</span>
    </button>
    <button class="footer-item" onclick="footerNav('price', this)">
        <svg class="footer-icon" viewBox="0 0 1024 1024"><path d="M512 64C264.6 64 64 264.6 64 512s200.6 448 448 448 448-200.6 448-448S759.4 64 512 64zm0 820c-205.4 0-372-166.6-372-372s166.6-372 372-372 372 166.6 372 372-166.6 372-372 372z"/></svg>
        各大品牌牌價
    </button>
    <button class="footer-item" onclick="footerNav('profile', this)">
        <svg class="footer-icon" viewBox="0 0 1024 1024"><path d="M512 512a192 192 0 1 0-192-192 192 192 0 0 0 192 192zm0 96c-128 0-384 64-384 192v64h768v-64c0-128-256-192-384-192z"/></svg>
        個人資訊
    </button>
</footer>

<!-- 各大品牌牌價表彈窗 -->
<div class="modal-overlay" id="priceModal" onclick="closeModal(event, 'priceModal')">
    <div class="price-modal-container">
        <div class="price-header">
            <div class="price-header-title">⚡ 各大品牌牌價</div>
            <button class="price-close-btn" onclick="toggleModal('priceModal', false)">✕</button>
        </div>

        <!-- 品牌選擇下拉與自訂折數輸入 (修改處) -->
        <div class="brand-control-bar">
            <select id="brandSelect" class="brand-select" onchange="onBrandChange()">
                <option value="KOYO">KOYO 台灣牌價 (分頁: KOYO)</option>
                <option value="FAG">FAG 工業牌價 (分頁: FAG)</option>
                <option value="SKF">SKF 精品牌價 (分頁: SKF)</option>
                <option value="ASAHI">ASAHI 軸承座 (分頁: ASAHI)</option>
            </select>
            <div class="discount-input-wrapper">
                <span>折數:</span>
                <input type="number" id="customDiscountInput" class="discount-input" value="0.35" step="0.01" min="0.01" max="1" oninput="handlePriceSearch()">
            </div>
        </div>

        <!-- 牌價查詢搜尋框 -->
        <div class="price-search-box">
            <div class="price-input-wrapper">
                <input type="text" id="priceSearchInput" class="price-input" placeholder="請輸入型號關鍵字..." oninput="handlePriceSearch()">
                <button class="price-search-action" onclick="handlePriceSearch()">搜尋</button>
            </div>
        </div>

        <!-- 結果顯示區 -->
        <div class="price-results-area" id="priceResultList"></div>
    </div>
</div>

<!-- 購物車彈窗 -->
<div class="modal-overlay" id="cartModal" onclick="closeModal(event, 'cartModal')">
    <div class="price-modal-container">
        <div class="price-header">
            <div class="price-header-title">🛒 已選購清單 / 購物車</div>
            <button class="price-close-btn" onclick="toggleModal('cartModal', false)">✕</button>
        </div>
        <div class="cart-content-area" id="cartContentArea"></div>
        <div class="cart-footer-bar" id="cartFooterBar">
            <div style="font-size: 14px; font-weight: bold;">總計金額：<span id="cartTotalPrice" style="color: #4cd964; font-size: 18px;">$0</span></div>
            <button class="checkout-btn" onclick="checkoutOrder()" style="width: auto; padding: 10px 25px;">送出詢價訂單</button>
        </div>
    </div>
</div>

<!-- 個人資訊彈窗 -->
<div class="modal-overlay" id="profileModal" onclick="closeModal(event, 'profileModal')">
    <div class="price-modal-container">
        <div class="price-header">
            <div class="price-header-title">👤 個人資訊與設定</div>
            <button class="price-close-btn" onclick="toggleModal('profileModal', false)">✕</button>
        </div>
        <div style="padding: 20px; overflow-y: auto;">
            <div style="background: var(--card-bg); padding: 18px; border-radius: 8px; border: 1px solid var(--border-color); margin-bottom: 15px;">
                <p style="margin: 0 0 8px 0; font-weight: bold; color: #61b0ff; font-size: 16px;">帳號狀態：VIP 業務經銷專用端</p>
                <p style="margin: 0 0 6px 0; font-size: 14px; color: var(--text-main);">營運中心：高雄營運中心</p>
                <p style="margin: 0; font-size: 13px; color: var(--text-secondary);">系統權限：線上即時牌價試算、庫存連線查詢、量大議價</p>
            </div>
        </div>
    </div>
</div>

<script>
    const GAS_URL = "https://script.google.com/macros/s/AKfycbzvSBMBHs9M3CKPEw0tfaOxPA58pSDgVAlN5cGHRFdPz2MW7kHB1KHJGYiYWOnX62mw/exec";
    let allData = [];
    let currentSelectedBrand = 'KOYO';
    let cart = []; 

    // 這裡對應你 Excel 檔中各個品牌分頁的資料 (可依需求擴充連結對應分頁資料)
    const brandPriceDB = {
        'KOYO': [
            { p: '6205ZZ', d: '深溝滾珠軸承', listPrice: 450, defaultDiscount: 0.35 },
            { p: '6206ZZ', d: '深溝滾珠軸承', listPrice: 580, defaultDiscount: 0.35 },
            { p: '32015AV', d: '圓錐滾子軸承', listPrice: 2400, defaultDiscount: 0.38 },
            { p: '6308ZZ', d: '深溝滾珠軸承', listPrice: 1150, defaultDiscount: 0.35 }
        ],
        'FAG': [
            { p: '6205ZZ', d: '深溝滾珠軸承 (FAG)', listPrice: 520, defaultDiscount: 0.32 },
            { p: '63072RS', d: '膠蓋深溝滾珠', listPrice: 980, defaultDiscount: 0.32 },
            { p: '32015JV', d: '圓錐滾子軸承', listPrice: 2800, defaultDiscount: 0.30 }
        ],
        'SKF': [
            { p: '6205-2Z', d: 'Explorer 高效能軸承', listPrice: 650, defaultDiscount: 0.30 },
            { p: '6206-2Z', d: 'Explorer 高效能軸承', listPrice: 820, defaultDiscount: 0.30 },
            { p: 'NJ205ECP', d: '圓柱滾子軸承', listPrice: 1500, defaultDiscount: 0.28 }
        ],
        'ASAHI': [
            { p: 'UCP205', d: '立式軸承座', listPrice: 620, defaultDiscount: 0.40 },
            { p: 'UCP206', d: '立式軸承座', listPrice: 750, defaultDiscount: 0.40 },
            { p: 'UCF205', d: '方型四孔軸承座', listPrice: 680, defaultDiscount: 0.40 }
        ]
    };

    async function initDB() {
        try {
            const res = await fetch(GAS_URL);
            const resData = await res.json();
            allData = resData.data;
            document.getElementById('loading').style.display = 'none';
            document.getElementById('searchInput').disabled = false;
            renderTable(allData.slice(0, 15));
        } catch (e) {
            console.error(e);
            document.getElementById('loading').innerHTML = '<span style="color:var(--skf-red);">資料庫連線失敗，請稍後再試</span>';
        }
    }

    function handleInput() {
        const query = document.getElementById('searchInput').value.trim().toLowerCase();
        const listEl = document.getElementById('autocompleteList');
        handleSearch();

        if (!query) {
            listEl.style.display = 'none';
            return;
        }

        const matches = allData.filter(item => item.p.toLowerCase().includes(query)).slice(0, 5);

        if (matches.length > 0) {
            listEl.innerHTML = matches.map(item => `
                <div class="autocomplete-item" onclick="selectSuggestion('${item.p}')">
                    <b>${item.p}</b> <span style="color:var(--text-secondary); font-size:12px;">(${item.d})</span>
                </div>
            `).join('');
            listEl.style.display = 'block';
        } else {
            listEl.style.display = 'none';
        }
    }

    function selectSuggestion(partNo) {
        document.getElementById('searchInput').value = partNo;
        document.getElementById('autocompleteList').style.display = 'none';
        handleSearch();
    }

    document.addEventListener('click', function(e) {
        if (!e.target.closest('.search-bar')) {
            document.getElementById('autocompleteList').style.display = 'none';
        }
    });

    function handleSearch() {
        const query = document.getElementById('searchInput').value.toLowerCase();
        const inStockOnly = document.getElementById('inStockOnly').checked;
        const filtered = allData.filter(item => {
            if (inStockOnly && Number(item.s || 0) <= 0) return false;
            return item.p.toLowerCase().includes(query) || item.d.toLowerCase().includes(query);
        });
        renderTable(filtered.slice(0, 15));
    }

    function quickSearch(kw, e) {
        document.getElementById('searchInput').value = kw;
        document.getElementById('autocompleteList').style.display = 'none';
        document.querySelectorAll('.tag').forEach(t => t.classList.remove('active'));
        if(e && e.target) e.target.classList.add('active');
        handleSearch();
    }

    function footerNav(action, el) {
        document.querySelectorAll('.footer-item').forEach(item => item.classList.remove('active'));
        el.classList.add('active');

        if (action === 'home') {
            document.getElementById('searchInput').value = '';
            document.getElementById('inStockOnly').checked = false;
            document.getElementById('autocompleteList').style.display = 'none';
            const tags = document.querySelectorAll('.tag');
            tags.forEach(t => t.classList.remove('active'));
            tags[0].classList.add('active');
            renderTable(allData.slice(0, 15));
            window.scrollTo({ top: 0, behavior: 'smooth' });
        } else if (action === 'cart') {
            toggleModal('cartModal', true);
            renderCart();
        } else if (action === 'price') {
            toggleModal('priceModal', true);
            onBrandChange();
        } else if (action === 'profile') {
            toggleModal('profileModal', true);
        }
    }

    function toggleModal(modalId, show) {
        document.getElementById(modalId).style.display = show ? 'flex' : 'none';
    }

    function closeModal(e, modalId) {
        if (e.target.id === modalId) {
            toggleModal(modalId, false);
        }
    }

    function onBrandChange() {
        const select = document.getElementById('brandSelect');
        currentSelectedBrand = select.value;
        const dataset = brandPriceDB[currentSelectedBrand] || [];
        if (dataset.length > 0 && dataset[0].defaultDiscount !== undefined) {
            document.getElementById('customDiscountInput').value = dataset[0].defaultDiscount;
        }
        document.getElementById('priceSearchInput').value = '';
        renderPriceResults(dataset);
    }

    function handlePriceSearch() {
        const query = document.getElementById('priceSearchInput').value.trim().toLowerCase();
        const dataset = brandPriceDB[currentSelectedBrand] || [];
        const filtered = dataset.filter(item => item.p.toLowerCase().includes(query) || item.d.toLowerCase().includes(query));
        renderPriceResults(filtered);
    }

    function renderPriceResults(items) {
        const container = document.getElementById('priceResultList');
        const userDiscount = parseFloat(document.getElementById('customDiscountInput').value) || 0.35;

        if (!items || items.length === 0) {
            container.innerHTML = `<div style="text-align:center; padding:30px; color:var(--text-secondary);">查無此 ${currentSelectedBrand} 品牌型號資料</div>`;
            return;
        }

        container.innerHTML = items.map(item => {
            const finalPrice = Math.round(item.listPrice * userDiscount);
            const discountPercentage = Math.round(userDiscount * 100);

            return `
                <div class="price-item-card">
                    <div class="price-info">
                        <h4 onclick="copyToClipboard('${item.p}')" style="cursor:pointer;" title="點擊複製">${item.p}</h4>
                        <p>${item.d}</p>
                        <div class="action-btn-group">
                            <button class="negotiate-btn" onclick="alert('已為您發起 [${currentSelectedBrand}] ${item.p} 量大議價詢問，將由專人聯繫！')">💬 議價</button>
                            <button class="add-cart-btn" onclick="addToCart('${currentSelectedBrand}', '${item.p}', '${item.d}', ${finalPrice})">🛒 加入購物車</button>
                        </div>
                    </div>
                    <div class="price-calc">
                        <div class="list-price">牌價 $${item.listPrice}</div>
                        <div>
                            <span class="final-price">$${finalPrice}</span>
                            <span class="discount-tag">${discountPercentage}折</span>
                        </div>
                    </div>
                </div>
            `;
        }).join('');
    }

    function addToCart(brand, partNo, desc, price) {
        const existing = cart.find(i => i.brand === brand && i.partNo === partNo);
        if (existing) {
            existing.qty += 1;
        } else {
            cart.push({ brand, partNo, desc, price, qty: 1 });
        }
        updateCartBadge();
        showToast(`已加入購物車: [${brand}] ${partNo}`);
    }

    function updateCartBadge() {
        const badge = document.getElementById('cartBadgeCount');
        const totalQty = cart.reduce((sum, item) => sum + item.qty, 0);
        if (totalQty > 0) {
            badge.innerText = totalQty;
            badge.style.display = 'block';
        } else {
            badge.style.display = 'none';
        }
    }

    function renderCart() {
        const container = document.getElementById('cartContentArea');
        const totalEl = document.getElementById('cartTotalPrice');
        
        if (cart.length === 0) {
            container.innerHTML = `<div style="text-align:center; padding:40px; color:var(--text-secondary);">目前購物車尚無品項，請從各大品牌牌價試算加入。</div>`;
            totalEl.innerText = '$0';
            return;
        }

        let totalPrice = 0;
        container.innerHTML = cart.map((item, index) => {
            const subtotal = item.price * item.qty;
            totalPrice += subtotal;
            return `
                <div class="cart-item-card">
                    <div class="cart-item-info">
                        <h4>[${item.brand}] ${item.partNo}</h4>
                        <p>${item.desc} | 單價: $${item.price}</p>
                    </div>
                    <div class="cart-item-controls">
                        <div style="display:flex; align-items:center; gap:4px;">
                            <button class="qty-btn" onclick="changeQty(${index}, -1)">-</button>
                            <input type="text" class="qty-input" value="${item.qty}" readonly>
                            <button class="qty-btn" onclick="changeQty(${index}, 1)">+</button>
                        </div>
                        <button class="cart-delete-btn" onclick="removeFromCart(${index})">刪除</button>
                    </div>
                </div>
            `;
        }).join('');

        totalEl.innerText = `$${totalPrice.toLocaleString()}`;
    }

    function changeQty(index, delta) {
        cart[index].qty += delta;
        if (cart[index].qty <= 0) {
            cart.splice(index, 1);
        }
        updateCartBadge();
        renderCart();
    }

    function removeFromCart(index) {
        cart.splice(index, 1);
        updateCartBadge();
        renderCart();
    }

    function checkoutOrder() {
        if (cart.length === 0) {
            alert('購物車是空的，無法送出訂單');
            return;
        }
        alert('訂單已成功送出！高雄營運中心專人將盡快與您聯繫確認庫存與交期。');
        cart = [];
        updateCartBadge();
        toggleModal('cartModal', false);
    }

    function copyToClipboard(text) {
        if (!text) return;
        if (navigator.clipboard && navigator.clipboard.writeText) {
            navigator.clipboard.writeText(text).then(() => showToast(text)).catch(() => fallbackCopy(text));
        } else {
            fallbackCopy(text);
        }
    }

    function fallbackCopy(text) {
        const area = document.createElement("textarea");
        area.value = text;
        area.style.position = "fixed";
        area.style.left = "-9999px";
        document.body.appendChild(area);
        area.select();
        document.execCommand('copy');
        document.body.removeChild(area);
        showToast(text);
    }

    function showToast(text) {
        const toast = document.createElement('div');
        toast.className = 'toast';
        toast.innerText = `已複製: ${text}`;
        document.body.appendChild(toast);
        setTimeout(() => toast.remove(), 2000);
    }

    function renderTable(items) {
        document.getElementById('resultBody').innerHTML = items.map(item => `
            <tr>
                <td class="td-partno" onclick="copyToClipboard('${item.p}')">${item.p}</td>
                <td>${item.d}</td>
                <td style="text-align: right;"><span class="stock-badge ${Number(item.s) <= 0 ? 'stock-zero' : 'stock-ok'}">${item.s || 0}</span></td>
            </tr>
        `).join('');
    }

    initDB();
</script>
</body>
</html>
